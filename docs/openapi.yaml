openapi: 3.1.0
info:
  title: Zamaron API
  version: 0.1.0
  description: |
    Backend API contract for the Zamaron platform, reverse-engineered from the
    frontend (Vite + React + TypeScript SPA).

    IMPORTANT: The repository contains NO backend today. Every endpoint defined
    here is **REQUIRED BACKEND ENDPOINT — NOT CURRENTLY IMPLEMENTED**. This file
    is the specification to build against; it is not documentation of a live API.

    Companion document: docs/API-SPECIFICATION.md
  license:
    name: Proprietary
servers:
  - url: /api/v1
    description: Same-origin API (v1)
tags:
  - name: Auth
  - name: Users
  - name: Audits
  - name: Billing
  - name: Vault
  - name: Governance
  - name: Academy
  - name: Admin
  - name: Security
  - name: Support
security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  # ------------------------------------------------------------------ AUTH
  /auth/login:
    post:
      tags: [Auth]
      summary: Password login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1 }
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/login/webauthn:
    post:
      tags: [Auth]
      summary: WebAuthn (passkey) login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, assertion]
              properties:
                email: { type: string, format: email }
                assertion: { type: object }
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/login/wallet:
    post:
      tags: [Auth]
      summary: Sign-In with Ethereum (EIP-4361)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, message, signature]
              properties:
                address: { type: string }
                message: { type: string }
                signature: { type: string }
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/register:
    post:
      tags: [Auth]
      summary: Operator induction (registration)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 1 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "201":
          description: Created + authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Invalidate current session
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/session:
    get:
      tags: [Auth]
      summary: Restore / introspect current session
      responses:
        "200":
          description: Session if any
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/AuthSession" }
                  - { type: "null" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/secure-gate:
    post:
      tags: [Auth]
      summary: Verify second factor (TOTP / hardware enclave)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /auth/wallet/connect:
    post:
      tags: [Auth]
      summary: Attach wallet to profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string }
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/wallet/disconnect:
    post:
      tags: [Auth]
      summary: Detach wallet from profile
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ------------------------------------------------------------------ USERS
  /users/me:
    get:
      tags: [Users]
      summary: Current operator profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Users]
      summary: Fetch a user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Users]
      summary: Update profile (self or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                avatarUrl: { type: string }
                walletAddress: { type: string }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/{id}/certificates:
    get:
      tags: [Users]
      summary: User's certificates
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Certificates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CertificateRecord" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users/{id}/activity:
    get:
      tags: [Users]
      summary: Recent activity ledger
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: Paginated activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PagedActivity" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users/{id}/skills:
    get:
      tags: [Users]
      summary: Skill tree nodes
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Skill nodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SkillNode" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users/{id}/proficiency:
    get:
      tags: [Users]
      summary: Mastery radar + summary
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Proficiency stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proficiency" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /leaderboard/auditors:
    get:
      tags: [Users]
      summary: Auditor leaderboard
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - name: sort
          in: query
          schema: { type: string, enum: [xp, verifiedBugs, bountiesEarned] }
      responses:
        "200":
          description: Paginated leaderboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditorRow" }
                  total: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ------------------------------------------------------------------ AUDITS
  /audits:
    get:
      tags: [Audits]
      summary: "List audits (client: own; auditor/admin: queue)"
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AuditStatus" }
        - name: q
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [submittedAt, progressPercent] }
        - name: dir
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: Paginated audits
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PageMeta" }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AuditRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Audits]
      summary: Create audit request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuditDraft" }
      responses:
        "201":
          description: Created audit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /audits/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Audits]
      summary: Fetch one audit
      responses:
        "200":
          description: Audit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Audits]
      summary: Advance status / assign lead / progress (auditor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: "#/components/schemas/AuditStatus" }
                leadAuditor: { type: string }
                progressPercent: { type: integer, minimum: 0, maximum: 100 }
      responses:
        "200":
          description: Updated audit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /audits/{id}/claim:
    post:
      tags: [Audits]
      summary: Auditor claims an engagement
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Claimed audit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /audits/{id}/findings:
    get:
      tags: [Audits]
      summary: List findings for an engagement
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - name: severity
          in: query
          schema: { $ref: "#/components/schemas/SeverityLevel" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/FindingStatus" }
      responses:
        "200":
          description: Paginated findings
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PageMeta" }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AuditFinding" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /audits/{id}/findings/{findingId}:
    patch:
      tags: [Audits]
      summary: Triage a finding (status + notes)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: findingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: "#/components/schemas/FindingStatus" }
                notes: { type: string }
      responses:
        "200":
          description: Updated finding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditFinding" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /audits/{id}/timeline:
    get:
      tags: [Audits]
      summary: 4-phase progress timeline
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Timeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditTimeline" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /audits/{id}/report:
    get:
      tags: [Audits]
      summary: Final report data
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Report payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinalReport" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /audits/{id}/report.pdf:
    get:
      tags: [Audits]
      summary: Signed PDF export
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: PDF binary
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }

  /audits/{id}/report/sign:
    post:
      tags: [Audits]
      summary: Sign and anchor the final report
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signature]
              properties:
                signature: { type: string }
      responses:
        "200":
          description: Signed report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinalReport" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ------------------------------------------------------------------ BILLING
  /pricing/tiers:
    get:
      tags: [Billing]
      summary: Audit pricing tiers
      security: []
      responses:
        "200":
          description: Tiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  tiers:
                    type: array
                    items: { $ref: "#/components/schemas/PricingTier" }

  /gateways:
    get:
      tags: [Billing]
      summary: List settlement gateways (admin)
      responses:
        "200":
          description: Gateways
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentGateway" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /gateways/{id}:
    patch:
      tags: [Billing]
      summary: Update a gateway (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                address: { type: string }
                settlementDelay: { type: string }
      responses:
        "200":
          description: Updated gateway
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentGateway" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /checkout/settlement:
    post:
      tags: [Billing]
      summary: Confirm escrow deposit and launch audit (atomic)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audit, rail, amountMinor]
              properties:
                audit: { $ref: "#/components/schemas/AuditDraft" }
                rail: { $ref: "#/components/schemas/Rail" }
                txHash: { type: string }
                amountMinor: { type: integer, minimum: 0 }
      responses:
        "201":
          description: Audit + billing record created
          content:
            application/json:
              schema:
                type: object
                properties:
                  audit: { $ref: "#/components/schemas/AuditRequest" }
                  billing: { $ref: "#/components/schemas/BillingTransaction" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /billing:
    get:
      tags: [Billing]
      summary: Billing history (admin)
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - name: status
          in: query
          schema: { type: string }
        - name: rail
          in: query
          schema: { $ref: "#/components/schemas/Rail" }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Paginated billing
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PageMeta" }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/BillingTransaction" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /billing/{id}:
    get:
      tags: [Billing]
      summary: Single invoice
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingTransaction" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /billing/export.csv:
    get:
      tags: [Billing]
      summary: CSV statement export (admin)
      responses:
        "200":
          description: CSV
          content:
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

  /refunds:
    get:
      tags: [Billing]
      summary: List refund requests (admin)
      responses:
        "200":
          description: Refunds
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RefundRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Billing]
      summary: Queue a refund (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoiceId, reason]
              properties:
                invoiceId: { type: string }
                client: { type: string }
                amount: { type: string }
                reason: { type: string }
      responses:
        "201":
          description: Refund queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /refunds/{id}/decision:
    post:
      tags: [Billing]
      summary: Approve/deny a refund (admin multi-sig)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVED, DENIED] }
      responses:
        "200":
          description: Decided refund
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ------------------------------------------------------------------ VAULT
  /vault/documents:
    get:
      tags: [Vault]
      summary: List vault documents
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - name: category
          in: query
          schema: { type: string, enum: [REPORTS, CERTIFICATES, SPECS, ALL], default: ALL }
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated documents
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PageMeta" }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/VaultDocument" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Vault]
      summary: Upload a document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title, category]
              properties:
                file: { type: string, format: binary }
                title: { type: string }
                category: { type: string, enum: [REPORTS, CERTIFICATES, SPECS] }
                type: { type: string, enum: [PDF, ZIP, TXT] }
      responses:
        "201":
          description: Uploaded document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaultDocument" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /vault/documents/{id}/download:
    get:
      tags: [Vault]
      summary: Download a document
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Binary download
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------------ GOVERNANCE
  /governance/proposals:
    get:
      tags: [Governance]
      summary: List DAO proposals
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ProposalStatus" }
      responses:
        "200":
          description: Paginated proposals
