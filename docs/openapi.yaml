  /skynet/overview:
    get:
      tags: [Security]
      summary: Skynet dashboard aggregates
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkynetOverview" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /security/incidents:
    get:
      tags: [Security]
      summary: Incident feed
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - name: severity
          in: query
          schema: { $ref: "#/components/schemas/IncidentSeverity" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/IncidentStatus" }
        - name: q
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Paginated incidents
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PageMeta" }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/SecurityIncident" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /security/incidents/stats:
    get:
      tags: [Security]
      summary: Incident aggregates
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalFundsLost: { type: integer }
                  critical: { type: integer }
                  ongoing: { type: integer }
                  last24h: { type: integer }
                  total: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  /whale-alerts:
    get:
      tags: [Security]
      summary: Whale alert feed
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - name: chain
          in: query
          schema: { type: string, enum: [ETH, SOL, BSC, AVAX, ARB] }
        - name: flagType
          in: query
          schema: { $ref: "#/components/schemas/FlagType" }
        - name: minUsdValue
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Paginated whale alerts
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PageMeta" }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/WhaleAlert" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /token/scan:
    post:
      tags: [Security]
      summary: Analyze a contract address for risk indicators
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contractAddress]
              properties:
                contractAddress:
                  type: string
                  pattern: "^0x[a-fA-F0-9]{40}$"
      responses:
        "200":
          description: Scan result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenScanResult" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /ecosystem/nodes:
    get:
      tags: [Security]
      summary: Node latency/load telemetry
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [HEALTHY, DEGRADED, HOT] }
      responses:
        "200":
          description: Node telemetry
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items: { $ref: "#/components/schemas/NodeRow" }
                  avgLatency: { type: integer }
                  hot: { type: integer }
                  uptimeWindow: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

  /status/services:
    get:
      tags: [Support]
      summary: Public service diagnostics
      security: []
      responses:
        "200":
          description: Service statuses
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceStatus" }

  # ------------------------------------------------------------------ SUPPORT
  /support/articles:
    get:
      tags: [Support]
      summary: Knowledge base articles
      security: []
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: Articles
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PageMeta" }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/KnowledgeArticle" }

  /support/articles/search:
    get:
      tags: [Support]
      summary: Search knowledge base
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Matching articles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KnowledgeArticle" }

  /support/tickets:
    post:
      tags: [Support]
      summary: Submit a support/incident ticket
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, subject, body, severity]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                subject: { type: string }
                body: { type: string }
                severity: { type: string, enum: [LOW, HIGH, CRITICAL] }
      responses:
        "201":
          description: Ticket queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicket" }
        "422": { $ref: "#/components/responses/ValidationError" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: zamaron_session
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Insufficient role/permission or cross-tenant access
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: State conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    PayloadTooLarge:
      description: Upload exceeds size limit
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [UNAUTHENTICATED, FORBIDDEN, VALIDATION_ERROR, NOT_FOUND, CONFLICT, RATE_LIMITED, INTERNAL]
            message: { type: string }
            details:
              type: object
              additionalProperties:
                type: array
                items: { type: string }

    UserRole:
      type: string
      enum: [CLIENT, AUDITOR, ADMIN, STUDENT]
    SecurityClearance:
      type: string
      enum: [ALPHA, BETA, GAMMA, OPERATOR]

    UserProfile:
      type: object
      required: [id, name, email, role, walletAddress, securityClearance]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
        walletAddress: { type: string }
        avatarUrl: { type: string }
        rank: { type: string }
        xp: { type: integer }
        certificationsCount: { type: integer }
        securityClearance: { $ref: "#/components/schemas/SecurityClearance" }

    AuthSession:
      type: object
      required: [user, walletConnected, issuedAt]
      properties:
        user: { $ref: "#/components/schemas/UserProfile" }
        walletConnected: { type: boolean }
        issuedAt: { type: string, format: date-time }

    AuditStatus:
      type: string
      enum: [QUEUED, SCANNING, IN_REVIEW, VERIFIED, COMPLETED]
    AuditTier:
      type: string
      enum: [STANDARD, PROFESSIONAL, ENTERPRISE]
    SeverityLevel:
      type: string
      enum: [CRITICAL, HIGH, MEDIUM, LOW, INFORMATIONAL]
    FindingStatus:
      type: string
      enum: [OPEN, CONFIRMED, RESOLVED, FALSE_POSITIVE]

    AuditRequest:
      type: object
      required: [id, projectName, protocolType, targetRepo, commitHash, submittedAt, status, progressPercent, findingsCount, tier]
      properties:
        id: { type: string }
        projectName: { type: string }
        protocolType: { type: string }
        targetRepo: { type: string }
        commitHash: { type: string }
        submittedAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/AuditStatus" }
        leadAuditor: { type: string }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
        findingsCount:
          type: object
          properties:
            critical: { type: integer }
            high: { type: integer }
            medium: { type: integer }
            low: { type: integer }
            info: { type: integer }
        tier: { $ref: "#/components/schemas/AuditTier" }
        tvlProtected: { type: string }
        ownerId: { type: string }
        ownerName: { type: string }
        attachments:
          type: array
          items: { type: string }

    AuditDraft:
      type: object
      required: [projectName, protocolType, targetRepo, commitHash, tier]
      properties:
        projectName: { type: string }
        protocolType: { type: string }
        targetRepo: { type: string }
        commitHash: { type: string }
        tier: { $ref: "#/components/schemas/AuditTier" }
        attachments:
          type: array
          items: { type: string }

    AuditFinding:
      type: object
      required: [id, title, severity, category, location, lineRange, description, remediation, status]
      properties:
        id: { type: string }
        title: { type: string }
        severity: { $ref: "#/components/schemas/SeverityLevel" }
        category: { type: string }
        swcCode: { type: string }
        location: { type: string }
        lineRange: { type: string }
        description: { type: string }
        remediation: { type: string }
        status: { $ref: "#/components/schemas/FindingStatus" }
        codeSnippet: { type: string }
        notes: { type: string }

    AuditTimeline:
      type: object
      properties:
        currentPhase: { type: integer, minimum: 1, maximum: 4 }
        phases:
          type: array
          items:
            type: object
            properties:
              num: { type: integer }
              title: { type: string }
              status: { type: string, enum: [PENDING, IN_PROGRESS, COMPLETED] }
              timestamp: { type: string }
              inspector: { type: string }
              findings: { type: string }

    FinalReport:
      type: object
      properties:
        reportId: { type: string }
        issueDate: { type: string, format: date }
        finalScore: { type: integer }
        criticalOpen: { type: integer }
        totalRemediated: { type: integer }
        totalFindings: { type: integer }
        findings:
          type: array
          items: { $ref: "#/components/schemas/AuditFinding" }
        anchor:
          type: object
          properties:
            hash: { type: string }
            auditor: { type: string }
            keyId: { type: string }
            block: { type: string }

    Rail:
      type: string
      enum: [USDC, ETH, WIRE, SOL]

    BillingTransaction:
      type: object
      required: [id, invoiceNumber, client, clientWallet, tier, amountMinor, currency, status, date, rail, description, txHash]
      properties:
        id: { type: string }
        invoiceNumber: { type: string }
        client: { type: string }
        clientWallet: { type: string }
        tier: { type: string }
        amountMinor: { type: integer }
        currency: { type: string }
        status: { type: string }
        date: { type: string, format: date }
        rail: { $ref: "#/components/schemas/Rail" }
        description: { type: string }
        txHash: { type: string }

    RefundRequest:
      type: object
      required: [id, invoiceId, client, amount, reason, status, requestedAt]
      properties:
        id: { type: string }
        invoiceId: { type: string }
        client: { type: string }
        amount: { type: string }
        reason: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, DENIED] }
        requestedAt: { type: string, format: date }
        decidedAt: { type: string, format: date }
        decidedBy: { type: string }

    PaymentGateway:
      type: object
      required: [id, name, rail, address, enabled, settlementDelay]
      properties:
        id: { type: string }
        name: { type: string }
        rail: { $ref: "#/components/schemas/Rail" }
        address: { type: string }
        enabled: { type: boolean }
        settlementDelay: { type: string }

    PricingTier:
      type: object
      required: [id, name, priceMinor, currency, turnaround]
      properties:
        id: { $ref: "#/components/schemas/AuditTier" }
        name: { type: string }
        priceMinor: { type: integer }
        currency: { type: string, default: USD }
        turnaround: { type: string }
        features:
          type: array
          items: { type: string }

    VaultDocument:
      type: object
      required: [id, title, category, fileSize, updatedAt, hash, type]
      properties:
        id: { type: string }
        title: { type: string }
        category: { type: string, enum: [REPORTS, CERTIFICATES, SPECS] }
        fileSize: { type: string }
        updatedAt: { type: string, format: date }
        hash: { type: string }
        type: { type: string, enum: [PDF, ZIP, TXT] }
        body: { type: string }
        ownerId: { type: string }

    ProposalStatus:
      type: string
      enum: [ACTIVE, PASSED, REJECTED, EXECUTING]

    GovernanceProposal:
      type: object
      required: [id, proposalNumber, title, author, createdDate, endDate, status, summary, forVotes, againstVotes, abstainVotes, quorumPercent, quorumTarget]
      properties:
        id: { type: string }
        proposalNumber: { type: string }
        title: { type: string }
        author: { type: string }
        createdDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { $ref: "#/components/schemas/ProposalStatus" }
        summary: { type: string }
        forVotes: { type: integer }
        againstVotes: { type: integer }
        abstainVotes: { type: integer }
        quorumPercent: { type: number }
        quorumTarget: { type: number }
        userVote: { type: string, enum: [FOR, AGAINST, ABSTAIN] }

    CourseCategory:
      type: string
      enum: [SMART_CONTRACT, DEFI_SECURITY, FORENSICS, OPCODES]
    Difficulty:
      type: string
      enum: [BEGINNER, INTERMEDIATE, ADVANCED, ELITE]
    CourseStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]

    AcademyCourse:
      type: object
      required: [id, slug, title, description, category, difficulty, durationMinutes, modulesCount, xpReward, progressPercent, thumbnail, instructor]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        category: { $ref: "#/components/schemas/CourseCategory" }
        difficulty: { $ref: "#/components/schemas/Difficulty" }
        durationMinutes: { type: integer }
        modulesCount: { type: integer }
        xpReward: { type: integer }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
        thumbnail: { type: string }
        instructor: { type: string }

    LessonTimestamp:
      type: object
      required: [id, time, label]
      properties:
        id: { type: string }
        time: { type: string }
        label: { type: string }

    CourseLesson:
      type: object
      required: [id, title, durationMinutes, content, timestamps]
      properties:
        id: { type: string }
        title: { type: string }
        durationMinutes: { type: integer }
        content: { type: string }
        videoUrl: { type: string }
        instructor: { type: string }
        takeaways: { type: string }
        timestamps:
          type: array
          items: { $ref: "#/components/schemas/LessonTimestamp" }

    CourseModule:
      type: object
      required: [id, title, order, lessons]
      properties:
        id: { type: string }
        title: { type: string }
        subtitle: { type: string }
        order: { type: integer }
        lessons:
          type: array
          items: { $ref: "#/components/schemas/CourseLesson" }

    ManagedCourse:
      type: object
      required: [id, slug, title, description, category, difficulty, instructor, thumbnail, xpReward, status, modules, createdAt, updatedAt]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        category: { $ref: "#/components/schemas/CourseCategory" }
        difficulty: { $ref: "#/components/schemas/Difficulty" }
        instructor: { type: string }
        thumbnail: { type: string }
        xpReward: { type: integer }
        status: { $ref: "#/components/schemas/CourseStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time }
        modules:
          type: array
          items: { $ref: "#/components/schemas/CourseModule" }

    CourseDraftInput:
      type: object
      required: [title, description, category, difficulty, instructor]
      properties:
        title: { type: string }
        slug: { type: string }
        description: { type: string }
        category: { $ref: "#/components/schemas/CourseCategory" }
        difficulty: { $ref: "#/components/schemas/Difficulty" }
        instructor: { type: string }
        thumbnail: { type: string }
        xpReward: { type: integer }

    ManagedCoursePatch:
      type: object
      properties:
        title: { type: string }
        slug: { type: string }
        description: { type: string }
        category: { $ref: "#/components/schemas/CourseCategory" }
        difficulty: { $ref: "#/components/schemas/Difficulty" }
        instructor: { type: string }
        thumbnail: { type: string }
        xpReward: { type: integer }
        modules:
          type: array
          items: { $ref: "#/components/schemas/CourseModule" }

    LearnerProgress:
      type: object
      required: [userId, courseId, completedLessonIds, progressPercent, startedAt]
      properties:
        userId: { type: string }
        courseId: { type: string }
        completedLessonIds:
          type: array
          items: { type: string }
        lastLessonId: { type: string }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }

    AssessmentQuestionPublic:
      type: object
      required: [id, prompt, options]
      properties:
        id: { type: string }
        prompt: { type: string }
        codeSnippet: { type: string }
        options:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              text: { type: string }

    AssessmentAttempt:
      type: object
      required: [id, userId, userName, courseId, answers, scorePercent, passed, completedAt]
      properties:
        id: { type: string }
        userId: { type: string }
        userName: { type: string }
        courseId: { type: string }
        answers:
          type: object
          additionalProperties: { type: string }
        scorePercent: { type: integer }
        passed: { type: boolean }
        completedAt: { type: string, format: date-time }

    CertificateRecord:
      type: object
      required: [id, userId, userName, courseId, courseTitle, scorePercent, issuedAt, hash]
      properties:
        id: { type: string }
        userId: { type: string }
        userName: { type: string }
        courseId: { type: string }
        courseTitle: { type: string }
        scorePercent: { type: integer }
        issuedAt: { type: string, format: date-time }
        hash: { type: string }

    SecurityLogEntry:
      type: object
      required: [id, timestamp, severity, eventSource, actor, action, ipAddress, status, hash]
      properties:
        id: { type: string }
        timestamp: { type: string }
        severity: { type: string, enum: [CRIT, WARN, INFO] }
        eventSource: { type: string }
        actor: { type: string }
        action: { type: string }
        ipAddress: { type: string }
        status: { type: string, enum: [BLOCKED, ALLOWED, FLAGGED, RESOLVED] }
        hash: { type: string }

    SecurityConfig:
      type: object
      required: [fido2Required, autoMitigate, ipWhitelisting, rateLimitStrict]
      properties:
        fido2Required: { type: boolean }
        autoMitigate: { type: boolean }
        ipWhitelisting: { type: boolean }
        rateLimitStrict: { type: boolean }

    OperatorRecord:
      type: object
      required: [id, name, email, role, walletAddress, clearance, status, lastSync]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
        walletAddress: { type: string }
        clearance: { $ref: "#/components/schemas/SecurityClearance" }
        status: { type: string, enum: [ACTIVE, SUSPENDED, ISOLATED] }
        lastSync: { type: string }

    ProtocolRecord:
      type: object
      required: [id, name, category, contractAddress, status, gasThresholdGwei, riskScore, lastSync]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        contractAddress: { type: string }
        status: { type: string, enum: [MONITORING, ISOLATED, RESTORED, BLACKLISTED] }
        gasThresholdGwei: { type: number }
        riskScore: { type: integer }
        lastSync: { type: string }

    ApiKeyRecord:
      type: object
      required: [id, name, prefix, scopes, rateLimit, status, createdAt, lastUsed]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        secret: { type: string, description: "Returned only on creation" }
        scopes: { type: string }
        rateLimit: { type: integer }
        status: { type: string, enum: [ACTIVE, REVOKED] }
        createdAt: { type: string, format: date }
        lastUsed: { type: string }

    AlertChannel:
      type: string
      enum: [WEBHOOK, EMAIL, TELEGRAM, PAGER]

    AlertRouteInput:
      type: object
      required: [name, eventSource, minSeverity, channel, target, enabled, threshold]
      properties:
        name: { type: string }
        eventSource: { type: string }
        minSeverity: { type: string, enum: [INFO, WARN, CRIT] }
        channel: { $ref: "#/components/schemas/AlertChannel" }
        target: { type: string }
        enabled: { type: boolean }
        threshold: { type: integer, minimum: 1 }

    AlertRoute:
      allOf:
        - { $ref: "#/components/schemas/AlertRouteInput" }
        - type: object
          required: [id]
          properties:
            id: { type: string }

    TokenReportOverrideInput:
      type: object
      required: [contractAddress, tokenName, ticker, chain, isHoneypot, hasMintFunction, hasBlacklist, hasProxy, liquidityLockedPercent, top10HoldersPercent]
      properties:
        contractAddress: { type: string }
        tokenName: { type: string }
        ticker: { type: string }
        chain: { type: string }
        notes: { type: string }
        isHoneypot: { type: boolean }
        hasMintFunction: { type: boolean }
        hasBlacklist: { type: boolean }
        hasProxy: { type: boolean }
        liquidityLockedPercent: { type: number, minimum: 0, maximum: 100 }
        top10HoldersPercent: { type: number, minimum: 0, maximum: 100 }

    TokenReportOverride:
      allOf:
        - { $ref: "#/components/schemas/TokenReportOverrideInput" }
        - type: object
          required: [id, updatedAt]
          properties:
            id: { type: string }
            updatedAt: { type: string, format: date }

    ProjectCategory:
      type: string
      enum: [DEX, LENDING, LAYER2, STAKING, MEME, BRIDGE, NFT, INFRASTRUCTURE]
    ProjectStage:
      type: string
      enum: [PRE_LAUNCH, LIVE, INCIDENT, DISCONTINUED]
    SecurityTier:
      type: string
      enum: [AAA, AA, A, BBB, BB, B, C, D]

    ScoreDimension:
      type: object
      required: [key, label, value, weight, description]
      properties:
        key:
          type: string
          enum: [codeSecurity, fundamentalHealth, operationalResilience, governanceStrength, marketStability, communityTrust]
        label: { type: string }
        value: { type: number, minimum: 0, maximum: 100 }
        weight: { type: number }
        description: { type: string }

    TokenRiskIndicators:
      type: object
      properties:
        isHoneypot: { type: boolean }
        isProxy: { type: boolean }
        hasMintFunction: { type: boolean }
        hasBlacklist: { type: boolean }
        hasPauseFunction: { type: boolean }
        ownerRenounced: { type: boolean }
        liquidityLockedPercent: { type: number }
        top10HoldersPercent: { type: number }
        buyTaxPercent: { type: number }
        sellTaxPercent: { type: number }
        contractVerified: { type: boolean }

    ScoredProject:
      type: object
      required: [id, name, symbol, category, chain, stage, contractAddress, dimensions, badges, auditHistory, monitors, tokenRisk, score, tier, rankPercentile, deductions]
      properties:
        id: { type: string }
        name: { type: string }
        symbol: { type: string }
        category: { $ref: "#/components/schemas/ProjectCategory" }
        chain: { type: string }
        stage: { $ref: "#/components/schemas/ProjectStage" }
        logoSeed: { type: string }
        description: { type: string }
        contractAddress: { type: string }
        website: { type: string }
        socialSentiment: { type: integer }
        marketCap: { type: string }
        volume24h: { type: string }
        tvl: { type: string }
        launchedAt: { type: string, format: date }
        dimensions:
          type: array
          items: { $ref: "#/components/schemas/ScoreDimension" }
        badges:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [AUDIT, KYC, BUG_BOUNTY, VERIFIED_CONTRACT, FORMAL_VERIFICATION] }
              label: { type: string }
              detail: { type: string }
              verified: { type: boolean }
        auditHistory:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              auditor: { type: string }
              date: { type: string, format: date }
              scope: { type: string }
              criticalFindings: { type: integer }
              highFindings: { type: integer }
              reportUrl: { type: string }
              status: { type: string, enum: [PUBLISHED, DRAFT, PARTIAL] }
        monitors:
          type: array
          items:
            type: object
            properties:
              target: { type: string, enum: [WEBSITE, CODE_REPOSITORY, SMART_CONTRACT, SOCIAL_MEDIA] }
              label: { type: string }
              status: { type: string, enum: [ACTIVE, INACTIVE, ALERT] }
              lastChecked: { type: string }
              detail: { type: string }
        tokenRisk: { $ref: "#/components/schemas/TokenRiskIndicators" }
        score: { type: number, minimum: 0, maximum: 100 }
        tier: { $ref: "#/components/schemas/SecurityTier" }
        rankPercentile: { type: number }
        deductions:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              points: { type: integer }

    IncidentSeverity:
      type: string
      enum: [CRITICAL, HIGH, MEDIUM, LOW]
    IncidentStatus:
      type: string
      enum: [ONGOING, CONTAINED, UNDER_INVESTIGATION, RESOLVED]

    SecurityIncident:
      type: object
      required: [id, timestamp, type, severity, projectName, chain, fundsLostUsd, summary, status]
      properties:
        id: { type: string }
        timestamp: { type: string, format: date-time }
        type:
          type: string
          enum: [EXPLOIT, RUGPULL, PHISHING, BRIDGE_HACK, ORACLE_MANIPULATION, FLASH_LOAN, PRIVATE_KEY_COMPROMISE]
        severity: { $ref: "#/components/schemas/IncidentSeverity" }
        projectName: { type: string }
        chain: { type: string }
        fundsLostUsd: { type: integer }
        summary: { type: string }
        txHash: { type: string }
        status: { $ref: "#/components/schemas/IncidentStatus" }

    FlagType:
      type: string
      enum: [WHALE_ACCUMULATION, LIQUIDITY_DRAIN, BRIDGE_OUTFLOW, SUSPICIOUS_MINT]

    WhaleAlert:
      type: object
      required: [id, timestamp, txHash, fromAddress, toAddress, tokenSymbol, tokenAmount, usdValue, chain, riskScore, flagType]
      properties:
        id: { type: string }
        timestamp: { type: string }
        txHash: { type: string }
        fromAddress: { type: string }
        toAddress: { type: string }
        tokenSymbol: { type: string }
        tokenAmount: { type: string }
        usdValue: { type: integer }
        chain: { type: string, enum: [ETH, SOL, BSC, AVAX, ARB] }
        riskScore: { type: integer }
        flagType: { $ref: "#/components/schemas/FlagType" }

    TokenScanResult:
      type: object
      required: [contractAddress, tokenName, ticker, chain, risk, flaggedCount, checks]
      properties:
        contractAddress: { type: string }
        tokenName: { type: string }
        ticker: { type: string }
        chain: { type: string }
        risk: { $ref: "#/components/schemas/TokenRiskIndicators" }
        flaggedCount: { type: integer }
        checks:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              status: { type: string, enum: [pass, warn, fail] }
              value: { type: string }

    NodeRow:
      type: object
      required: [id, name, region, latency, load, status]
      properties:
        id: { type: string }
        name: { type: string }
        region: { type: string }
        latency: { type: integer }
        load: { type: integer, minimum: 0, maximum: 100 }
        status: { type: string, enum: [HEALTHY, DEGRADED, HOT] }

    EcosystemRow:
      type: object
      required: [rank, name, zScore, tvp, auditedCount, threatsBlocked]
      properties:
        rank: { type: integer }
        name: { type: string }
        zScore: { type: number }
        tvp: { type: string }
        auditedCount: { type: integer }
        threatsBlocked: { type: integer }

    SkynetOverview:
      type: object
      properties:
        kpis:
          type: object
          additionalProperties: true
        prelaunchWatchlist:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              symbol: { type: string }
              score: { type: number }
              rating: { $ref: "#/components/schemas/SecurityTier" }
              sentiment: { type: string }
              coverage: { type: string }
              date: { type: string }
              stage: { type: string }
        liveMonitoring:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              score: { type: number }
              rating: { $ref: "#/components/schemas/SecurityTier" }
              marketCap: { type: string }
              volume: { type: string }
              price: { type: string }
              change24h: { type: string }

    ServiceStatus:
      type: object
      required: [name, status, latency]
      properties:
        name: { type: string }
        status: { type: string }
        latency: { type: string }

    KnowledgeArticle:
      type: object
      required: [id, category, title, body, tags]
      properties:
        id: { type: string }
        category: { type: string }
        title: { type: string }
        body: { type: string }
        tags:
          type: array
          items: { type: string }

    SupportTicket:
      type: object
      required: [id, name, email, subject, body, severity, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        subject: { type: string }
        body: { type: string }
        severity: { type: string, enum: [LOW, HIGH, CRITICAL] }
        createdAt: { type: string, format: date-time }

    SkillNode:
      type: object
      required: [id, name, level, status, xp]
      properties:
        id: { type: string }
        name: { type: string }
        level: { type: string }
        status: { type: string, enum: [UNLOCKED, IN_PROGRESS, LOCKED] }
        xp: { type: string }

    Proficiency:
      type: object
      properties:
        radar:
          type: array
          items:
            type: object
            properties:
              axis: { type: string }
              value: { type: integer, minimum: 0, maximum: 100 }
        summary:
          type: object
          properties:
            score: { type: integer }
            status: { type: string }
            title: { type: string }
            description: { type: string }
            globalRank: { type: string }
            xpEarned: { type: string }
            streaks: { type: string }

    AuditorRow:
      type: object
      required: [rank, name, handle, xp, verifiedBugs, bountiesEarned, badge]
      properties:
        rank: { type: integer }
        name: { type: string }
        handle: { type: string }
        xp: { type: integer }
        verifiedBugs: { type: integer }
        bountiesEarned: { type: string }
        badge: { type: string }

    PagedActivity:
      allOf:
        - { $ref: "#/components/schemas/PageMeta" }
        - type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  action: { type: string }
                  target: { type: string }
                  time: { type: string }
                  xp: { type: string }

    PageMeta:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
